<style>
  /* No underlines on any header links. Active page is bold, others are plain. */
  .hdr-nav-links a, .hdr-nav-links a:hover, .mobile-nav-overlay a, .mobile-nav-overlay a:hover { text-decoration: none !important; }
  .hdr-nav-links a { border-bottom: none !important; }
</style>
<div class="hdr">
  <div class="hdr-inner">
    <div style="display:flex;align-items:center;gap:1.8rem;flex-wrap:wrap">
      <a href="/"><img src="https://static.wixstatic.com/media/d7782b_c8da6516ec35423b930841d288841df0~mv2.png" alt="Mike Charlie Co." style="height:38px;width:auto;object-fit:contain"></a>
      <div class="hdr-nav-links">
        <a href="/" data-nav="shop">Shop</a>
        <a href="/hotel-partner-program" data-nav="hotel-partner-program">Hotel Partner Program</a>
        <a href="/?category=preloved" data-nav="preloved">Preloved Clearance Sale</a>
      </div>
    </div>
    <div class="hdr-actions">
      <button class="auth-link" id="auth-link" onclick="openAuthModal()">Log In / Sign Up</button>
      <button class="hdr-btn" onclick="openCart()">🛍️<span class="cart-badge" id="cart-badge" style="display:none">0</span></button>
      <button class="hamburger-btn" onclick="openMobileNav()">☰</button>
    </div>
  </div>
</div>

<div class="mobile-nav-overlay" id="mobile-nav-overlay">
  <button class="mobile-nav-close" onclick="closeMobileNav()">✕</button>
  <a href="/">Shop</a>
  <a href="/hotel-partner-program">Hotel Partner Program</a>
  <a href="/?category=preloved">Preloved Clearance Sale</a>
  <div id="mnav-auth" style="display:contents"><button class="mnav-item" onclick="closeMobileNav();openAuthModal()">Log In / Sign Up</button></div>
</div>

<script>
// Highlight the current page's nav link once the header is injected
(function(){
  const path = window.location.pathname.replace(/\/$/, '') || '/';
  const params = new URLSearchParams(window.location.search);
  const isPreloved = (path === '' || path === '/') && params.get('category') === 'preloved';
  document.querySelectorAll('.hdr-nav-links a').forEach(a=>{
    const isShop = a.dataset.nav === 'shop' && (path === '' || path === '/') && !isPreloved;
    const isHotel = a.dataset.nav === 'hotel-partner-program' && path.includes('hotel-partner-program');
    const isPrelovedLink = a.dataset.nav === 'preloved' && isPreloved;
    if (isShop || isHotel || isPrelovedLink) {
      a.style.color = 'var(--lagoon)';
      a.style.fontWeight = '700';
    } else {
      a.style.color = 'var(--text-mid)';
      a.style.fontWeight = '400';
    }
  });
  // Same idea in the mobile menu: active page bold, everything else plain
  document.querySelectorAll('.mobile-nav-overlay a').forEach(a=>{
    const href = a.getAttribute('href') || '';
    const isShop = href === '/' && (path === '' || path === '/') && !isPreloved;
    const isHotel = href.includes('hotel-partner-program') && path.includes('hotel-partner-program');
    const isPrelovedLink = href.includes('category=preloved') && isPreloved;
    a.style.fontWeight = (isShop || isHotel || isPrelovedLink) ? '700' : '400';
  });
})();
</script>
