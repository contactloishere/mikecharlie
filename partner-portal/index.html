<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Partner Portal | Mike Charlie Co.</title>
<meta name="description" content="Log in or sign up to the Mike Charlie Co. Partner Portal for hotels and retail stores.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --lagoon:#3E5F5C;--lagoon-dark:#2C4542;--teal:#729A94;--teal-light:#A8C5C0;
  --golden:#D1A679;--golden-dark:#B8905F;--sand:#E6D5C3;--sand-light:#F0E8DA;
  --pearl:#F7F3EC;--white:#FFFFFF;
  --text-dark:#1C2E2C;--text-mid:#4A6862;--text-muted:#8FA9A4;
  --danger:#C1121F;--danger-bg:#FFE8E8;--danger-border:#F5A0A0;
  --success:#2D6A4F;--success-bg:#D8F3DC;--success-border:#A3D9B1;
  --warn:#92600A;--warn-bg:#FFF0CC;
  --shadow:0 2px 12px rgba(62,95,92,0.09);
  --shadow-lg:0 8px 36px rgba(62,95,92,0.18);
}
body{font-family:'DM Sans',sans-serif;background:var(--pearl);color:var(--text-dark);min-height:100vh;font-size:15px}
h1,h2,h3{font-family:'Cormorant Garamond',serif}
button{font-family:'DM Sans',sans-serif;cursor:pointer}
a{color:inherit}

/* HEADER (same as the shop) */
.hdr{position:sticky;top:0;z-index:90;background:var(--pearl);border-bottom:1px solid var(--sand);padding:1rem 1.25rem}
.hdr-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.hdr-actions{display:flex;align-items:center;gap:10px}
.hdr-nav-links{display:flex;gap:1.4rem;font-size:13px}
.hamburger-btn{display:none;background:none;border:none;font-size:22px;color:var(--lagoon);cursor:pointer;padding:4px}
@media(max-width:759px){
  .hdr-nav-links{display:none}
  #auth-link{display:none}
  .hamburger-btn{display:block}
}
.mobile-nav-overlay{position:fixed;inset:0;background:var(--lagoon);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem}
.mobile-nav-overlay.show{display:flex}
.mobile-nav-overlay a,.mobile-nav-overlay button.mnav-item{color:white;font-size:1.3rem;font-weight:600;background:none;border:none;cursor:pointer}
.mobile-nav-close{position:absolute;top:20px;right:20px;font-size:30px;color:white;background:none;border:none;cursor:pointer;line-height:1}
.hdr-btn{background:none;border:none;font-size:20px;color:var(--lagoon);position:relative;padding:4px}
.cart-badge{position:absolute;top:-2px;right:-2px;background:var(--danger);color:white;font-size:10px;font-weight:700;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.auth-link{background:var(--lagoon);color:var(--pearl);border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500}

/* TOTE BAG DRAWER (so the bag button in the header still works) */
.cart-overlay{position:fixed;inset:0;background:rgba(28,46,44,.5);z-index:150;display:none}
.cart-overlay.show{display:block}
.cart-drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:420px;background:white;z-index:151;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.cart-drawer.show{transform:translateX(0)}
.cart-drawer:not(.show){box-shadow:none}
.cart-hdr{padding:1.25rem;border-bottom:1px solid var(--sand);display:flex;justify-content:space-between;align-items:center}
.cart-hdr h2{font-size:1.3rem;color:var(--lagoon)}
.cart-close{background:var(--sand);border:none;border-radius:50%;width:32px;height:32px;font-size:16px}
.cart-items{flex:1;overflow-y:auto;padding:1rem 1.25rem}
.cart-empty{text-align:center;color:var(--text-muted);padding:2rem 0;font-size:14px}
.cart-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--sand-light)}
.cart-item-img{width:56px;height:56px;border-radius:8px;background:var(--sand-light);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.cart-item-info{flex:1}
.cart-item-name{font-size:13px;font-weight:500}
.cart-item-var{font-size:11px;color:var(--text-muted)}
.cart-item-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px}
.cart-item-price{font-weight:600;color:var(--lagoon)}
.cart-footer{padding:1.25rem;border-top:1px solid var(--sand)}
.cart-total-row{display:flex;justify-content:space-between;margin-bottom:12px}
.cart-total-lbl{font-size:14px;color:var(--text-mid)}
.cart-total-amt{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--lagoon);font-weight:600}

/* MEMBER LOGIN POPUP (opened by the header button) */
.modal{position:fixed;inset:0;background:rgba(28,46,44,.65);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
.modal.show{display:flex}
.modal-box{background:white;border-radius:16px;padding:2rem 1.75rem;width:100%;max-width:380px;box-shadow:var(--shadow-lg);position:relative;max-height:90vh;overflow-y:auto}
.modal-close{position:absolute;top:12px;right:14px;background:var(--sand);border:none;border-radius:50%;width:30px;height:30px;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text-mid)}
.modal-box h2{font-size:1.5rem;color:var(--lagoon);text-align:center;margin-bottom:1.25rem}
.auth-tabs{display:flex;background:var(--pearl);border-radius:9px;padding:3px;margin-bottom:1.25rem}
.auth-tab{flex:1;padding:8px;border:none;background:none;border-radius:7px;font-size:13px;font-weight:500;color:var(--text-muted)}
.auth-tab.on{background:white;color:var(--lagoon);box-shadow:var(--shadow)}
.auth-err{background:var(--danger-bg);border:1px solid var(--danger-border);color:var(--danger);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:12px;display:none}
.auth-ok{background:var(--success-bg);border:1px solid var(--success-border);color:var(--success);text-align:center;padding:1.5rem 1rem;border-radius:9px}
.auth-ok h3{color:var(--success);margin-bottom:6px}
.auth-ok p{font-size:13px;color:var(--text-mid);line-height:1.5}

/* FORM PIECES */
.lbl{display:block;font-size:13px;color:var(--text-mid);margin-bottom:5px;font-weight:500}
.inp{width:100%;padding:11px 12px;border:1.5px solid var(--sand);border-radius:9px;font-family:inherit;font-size:14px;background:white;color:var(--text-dark);margin-bottom:14px;outline:none}
.inp:focus{border-color:var(--teal)}
.btn{display:block;width:100%;padding:13px;border-radius:9px;font-size:14px;font-weight:500;border:none;text-align:center}
.btn-p{background:var(--lagoon);color:var(--pearl)}
.btn-o{background:transparent;color:var(--lagoon);border:1.5px solid var(--lagoon)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.req{color:var(--danger);font-weight:600}

/* PARTNER PORTAL PAGE */
.wrap{max-width:460px;margin:0 auto;padding:2rem 1.25rem 4rem}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:600;text-align:center;margin-bottom:6px}
.wrap h1{font-size:2rem;color:var(--lagoon);text-align:center;line-height:1.15;margin-bottom:8px}
.intro{font-size:14px;color:var(--text-mid);line-height:1.65;text-align:center;margin-bottom:1.5rem}
.card{background:white;border:1px solid var(--sand);border-radius:14px;padding:1.4rem;box-shadow:var(--shadow);margin-bottom:1rem}
.card h2{font-size:1.25rem;color:var(--lagoon);margin-bottom:.9rem}
.divider{display:flex;align-items:center;gap:10px;margin:14px 0 12px;color:var(--text-muted);font-size:12px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--sand)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.type-card{display:flex;align-items:center;gap:8px;border:1.5px solid var(--sand);border-radius:10px;padding:11px 12px;cursor:pointer;background:white;font-size:13.5px;font-weight:500;color:var(--text-dark);user-select:none}
.type-card input{accent-color:var(--lagoon);width:16px;height:16px;flex-shrink:0}
.type-card.on{border-color:var(--lagoon);background:var(--pearl)}
.hint{font-size:11.5px;color:var(--text-muted);margin:-8px 0 14px;line-height:1.5}
.spin{width:34px;height:34px;border:3px solid var(--sand);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin:3rem auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.center{text-align:center}
.muted{color:var(--text-muted)}
.badge{display:inline-block;background:var(--pearl);border:1px solid var(--sand);color:var(--lagoon);font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px;margin:0 4px 4px 0}
.row{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--sand-light);color:var(--text-mid)}
.row:last-child{border-bottom:none}
.row b{color:var(--text-dark);font-weight:500;text-align:right;word-break:break-word}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--lagoon);color:white;padding:12px 20px;border-radius:9px;font-size:14px;z-index:400;box-shadow:var(--shadow-lg);display:none;max-width:92vw;text-align:center}

/* DASHBOARD (wider than the sign-up screen) */
.wrap.wide{max-width:1100px}
.tabs{display:flex;gap:4px;overflow-x:auto;background:white;border:1px solid var(--sand);border-radius:12px;padding:4px;margin-bottom:1rem;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:10px 16px;border:none;background:none;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--text-mid);white-space:nowrap}
.tab.on{background:var(--lagoon);color:var(--pearl)}
.sec-title{font-size:1.5rem;color:var(--lagoon);margin:1.4rem 0 .3rem}
.sec-sub{font-size:13px;color:var(--text-muted);margin-bottom:1rem;line-height:1.55}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
.set-card{background:white;border:1.5px solid var(--sand);border-radius:14px;padding:1.1rem;display:flex;flex-direction:column;gap:8px}
.set-card h3{font-size:1.25rem;color:var(--lagoon)}
.set-card ul{list-style:none;font-size:12.5px;color:var(--text-mid);line-height:1.7;flex:1}
.set-card ul li:before{content:"✓ ";color:var(--teal);font-weight:700}
.set-price{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--lagoon);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pcard{background:white;border:1px solid var(--sand);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pimg{aspect-ratio:1/1;background:var(--sand-light);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}
.pbody{padding:.9rem;display:flex;flex-direction:column;gap:6px;flex:1}
.pname{font-size:14px;font-weight:600;color:var(--text-dark);line-height:1.3}
.pprice{font-size:13px;color:var(--text-mid)}
.pprice b{color:var(--lagoon);font-size:15px}
.tiers{font-size:12px;background:var(--pearl);border:1px solid var(--sand);border-radius:9px;padding:7px 9px;color:var(--text-mid);line-height:1.65}
.tiers b{color:var(--lagoon)}
.pvars{font-size:11.5px;color:var(--text-muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper>button:not(.btn){width:32px;height:32px;border-radius:8px;border:1.5px solid var(--sand);background:white;font-size:16px;color:var(--lagoon)}
.stepper .btn{width:auto}
.stepper input{width:54px;text-align:center;padding:7px 4px;border:1.5px solid var(--sand);border-radius:8px;font-size:14px;font-family:inherit}
.btn-s{padding:10px;font-size:13px}
.cartbar-wrap{position:sticky;top:76px;z-index:40}
.cartbar{background:var(--lagoon);color:var(--pearl);border-radius:12px;padding:11px 16px;margin:0 0 1rem;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:var(--shadow-lg)}
.privacy-note{font-size:11.5px;line-height:1.55;color:var(--muted);text-align:center;margin-top:10px}
.cartbar.empty{background:var(--sand);color:var(--lagoon);box-shadow:none}
.cartbar button{background:var(--golden);color:var(--text-dark);border:none;border-radius:9px;padding:9px 16px;font-weight:600;font-size:13.5px;flex-shrink:0;cursor:pointer}
.cartbar.empty button{background:white;border:1px solid var(--lagoon);color:var(--lagoon)}
.bar{position:sticky;bottom:0;background:var(--lagoon);color:var(--pearl);border-radius:12px;padding:12px 16px;margin-top:1.2rem;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:var(--shadow-lg)}
.bar button{background:var(--golden);color:var(--text-dark);border:none;border-radius:9px;padding:10px 18px;font-weight:600;font-size:13.5px}

/* VARIANT PICKER */
.pk-overlay{position:fixed;inset:0;background:rgba(28,46,44,.6);z-index:250;display:none;align-items:flex-end;justify-content:center}
.pk-overlay.show{display:flex}
.pk-sheet{background:white;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:1.4rem 1.25rem 1.6rem;position:relative}
@media(min-width:640px){.pk-overlay{align-items:center}.pk-sheet{border-radius:16px}}
.pk-sheet h2{font-size:1.45rem;color:var(--lagoon);margin-bottom:12px;padding-right:34px}
.pk-x{position:absolute;top:12px;right:14px;background:var(--sand);border:none;border-radius:50%;width:30px;height:30px;font-size:14px}
.pk-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--sand-light);font-size:14px}
.pk-row input[type=checkbox]{accent-color:var(--lagoon);width:17px;height:17px;flex-shrink:0}
.pk-all{font-weight:600;color:var(--lagoon);gap:9px}
.pk-q{width:70px;padding:7px;border:1.5px solid var(--sand);border-radius:8px;text-align:center;font-size:14px;font-family:inherit}
.pk-note{background:var(--pearl);border:1px solid var(--sand);border-radius:10px;padding:12px;font-size:13px;color:var(--text-mid);line-height:1.55}
.pk-count{font-size:13px;margin-top:12px;font-weight:500;color:var(--text-mid)}
.pk-count.good{color:var(--success)}.pk-count.bad{color:var(--danger)}
.pk-price{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-size:14px;color:var(--text-mid)}
.pk-price b{color:var(--lagoon)}
.pk-tot{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--lagoon);font-weight:600}
.pk-stepper{margin-bottom:4px}.pk-stepper>button:not(.btn){width:40px;height:40px;font-size:20px}.pk-stepper input{width:80px;height:40px;font-size:16px}
.pk-choose{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:11px 12px;border:1.5px solid var(--sand);border-radius:10px;font-size:14px;cursor:pointer;line-height:1.4}
.pk-choose small{color:var(--text-muted);font-size:12px}.pk-choose input{accent-color:var(--lagoon);width:18px;height:18px;margin-top:1px;flex-shrink:0}
.pk-in{background:var(--pearl);border:1px solid var(--sand);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px;line-height:2}
.pk-chip{display:inline-block;background:white;border:1px solid var(--teal);color:var(--lagoon);border-radius:20px;padding:1px 10px;margin:0 4px 0 0;font-size:12.5px}
#pk-select{margin-bottom:0}
.pk-nudge{background:var(--warn-bg);color:var(--warn);border-radius:9px;padding:9px 12px;font-size:13px;margin-top:8px;line-height:1.5}

/* CHECKOUT */
.ck-grid{display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:900px){.ck-grid{grid-template-columns:1.4fr 1fr;align-items:start}}
.ck-line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--sand-light);font-size:13.5px}
.ck-line:last-child{border-bottom:none}
.ck-line .nm{flex:1;min-width:0}.ck-line .nm small{display:block;color:var(--text-muted);font-size:12px}
.ck-q{display:flex;align-items:center;gap:4px}
.ck-q button{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--sand);background:white;color:var(--lagoon)}
.ck-q span{min-width:26px;text-align:center}
.ck-x{background:none;border:none;color:var(--text-muted);font-size:16px;padding:4px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--sand);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer;font-size:13.5px;background:white}
.opt.on{border-color:var(--lagoon);background:var(--pearl)}
.opt input{margin-top:3px;accent-color:var(--lagoon)}
.opt small{display:block;color:var(--text-muted);font-size:12px;line-height:1.5;margin-top:2px}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:var(--text-mid)}
.tot.big{border-top:1px solid var(--sand);margin-top:6px;padding-top:12px;font-size:1.1rem;color:var(--lagoon);font-weight:600}

/* TRACKING */
.pbar-wrap{margin:10px 0 4px}.pbar-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--lagoon);margin-bottom:5px}.pbar{height:10px;border-radius:10px;background:var(--sand);overflow:hidden}.pbar-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--teal),var(--lagoon));transition:width .6s ease}
.steps{display:flex;gap:0;margin:12px 0 4px;overflow-x:auto;padding-bottom:4px}
.step{flex:1 0 74px;text-align:center;position:relative;font-size:11.5px;color:var(--text-muted);line-height:1.3;padding:0 3px}
.step:before{content:"";position:absolute;top:10px;left:-50%;width:100%;height:2px;background:var(--sand);z-index:0}
.step:first-child:before{display:none}
.step i{display:block;width:22px;height:22px;border-radius:50%;background:white;border:2px solid var(--sand);margin:0 auto 6px;position:relative;z-index:1;font-style:normal;font-size:11px;line-height:18px;color:white}
.step.done{color:var(--lagoon)}.step.done:before{background:var(--teal)}.step.done i{background:var(--teal);border-color:var(--teal)}
.step.now{color:var(--lagoon);font-weight:600}.step.now:before{background:var(--teal)}.step.now i{border-color:var(--lagoon);background:var(--lagoon)}
.step small{display:block;font-weight:400;color:var(--text-muted);font-size:10.5px}
@media(max-width:640px){
.steps{flex-direction:column;overflow:visible;margin:14px 0 6px 2px;padding:0}
.step{flex:none;display:flex;align-items:flex-start;gap:12px;text-align:left;font-size:14px;padding:0 0 18px;min-height:24px}
.step:last-child{padding-bottom:0}
.step:before{top:-18px;left:10px;width:2px;height:18px}
.step i{margin:0;flex-shrink:0}
.step .sl{padding-top:1px}.step small{font-size:11.5px}}
.trk{background:var(--success-bg);border:1px solid var(--success-border);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--success);margin-top:10px;line-height:1.55}
.trk b{font-size:15px;letter-spacing:.03em}

/* invoice viewer + receipt animation */
.inv-overlay{position:fixed;inset:0;background:rgba(28,46,44,.72);z-index:500;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:1rem}
.inv-overlay.show{display:flex}
.inv-sheet{position:relative;background:var(--pearl);border-radius:14px;padding:1.2rem;width:100%;max-width:560px;margin:auto;box-shadow:var(--shadow-lg)}
.inv-img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--sand);background:white}
.inv-btns{margin-top:12px}.inv-btns .btn{margin-top:8px}
.rc-wrap{width:100%;max-width:340px;margin:auto;display:flex;flex-direction:column;align-items:center;padding-top:.5rem}
.rc-printer{width:320px;height:46px;background:linear-gradient(#3E5F5C,#2C4542);border-radius:14px 14px 6px 6px;position:relative;z-index:2;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.rc-slot{position:absolute;left:16px;right:16px;bottom:8px;height:8px;border-radius:5px;background:#10201e}
.rc-feed{width:290px;margin-top:-4px;position:relative;z-index:1}
.rc-paper{background:#fff;width:100%;padding:14px 16px 26px;font-family:ui-monospace,Menlo,Consolas,'Courier New',monospace;font-size:12px;color:#1C2E2C;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.22);
 -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;padding-bottom:30px}
.rc-printing{animation:rcShake .12s linear infinite}
@keyframes rcShake{0%{transform:translateX(0)}25%{transform:translateX(.6px)}75%{transform:translateX(-.6px)}100%{transform:translateX(0)}}
.rc-line{animation:rcIn .22s ease-out both}
@keyframes rcIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.rc-torn{animation:rcTear .5s ease-out both}
@keyframes rcTear{0%{transform:translateY(0) rotate(0)}60%{transform:translateY(8px) rotate(-.8deg)}100%{transform:translateY(4px) rotate(-.4deg)}}
.rc-logo{text-align:center;margin-bottom:4px}.rc-logo img{width:150px;filter:none}
.rc-c{text-align:center}.rc-b{font-weight:700;letter-spacing:.08em}.rc-s{font-size:11px;color:#4A6862}
.rc-dash{border-top:1.5px dashed #8FA9A4;margin:7px 0}
.rc-row{display:flex;justify-content:space-between;gap:8px}.rc-big{font-weight:700;font-size:14px;margin-top:3px}
.rc-it{font-weight:600}.rc-it em{display:block;font-style:normal;font-weight:400;font-size:10.5px;color:#4A6862}
.rc-bars{height:34px;margin-top:8px;background:repeating-linear-gradient(90deg,#1C2E2C 0 2px,#fff 2px 4px,#1C2E2C 4px 5px,#fff 5px 8px,#1C2E2C 8px 11px,#fff 11px 13px)}
.rc-actions{width:290px;margin-top:16px}.rc-actions .btn{margin-top:8px}
@media(prefers-reduced-motion:reduce){.rc-printing,.rc-line,.rc-torn{animation:none}}
</style>
